# Lyrebird (offline dictation) — this machine's settings.
#
# Lyrebird is treated as a dependency: the program lives in its own checkout,
# the CONFIGURATION lives here and is symlinked in by i3/scripts/dictate. That
# way the settings are version-controlled and survive the checkout being moved,
# reinstalled or deleted — which has already happened once.
#
# Loaded as an overlay ON TOP of the checkout's config/config.ini (see
# load_config in src/dictate.py), and gitignored there, so the committed
# defaults stay correct for the Mac while these apply only here.

[hotkey]
# Only used by the pynput listener, which is not the front end on Linux — i3
# binds F9 and runs `dictate --toggle`. Kept in step so the two agree.
key = f9
mode = toggle

[transcription]
# NOT mlx: that is the Apple Metal backend and it raises
# "MLX backend requested but unavailable: not Apple Silicon" here.
# auto resolves to ctranslate2 (faster-whisper).
backend = auto

# GPU. ctranslate2 could always see the card (get_cuda_device_count() == 1) but
# could not load: "Library libcublas.so.12 is not found". The libraries were
# simply absent — nvidia-cublas-cu12 and nvidia-cudnn-cu12 are now installed in
# Lyrebird's venv, and the systemd unit puts them on LD_LIBRARY_PATH.
#
# Measured on identical input, GPU is ~15x faster than CPU int8. Treat the
# absolute figures with suspicion: the benchmark used shaped noise rather than
# speech, and Whisper short-circuits on non-speech. Real speech on CPU measured
# 0.7x realtime, so live typing could not keep up; on GPU it comfortably can.
#
# Holding the model keeps the dGPU awake, roughly 6W at idle. That is accepted,
# not a problem to solve: this is a 74.5Wh gaming laptop with an i9-14900HX, it
# was never going to be an all-day battery machine, and CPU inference runs at
# 0.7x realtime — too slow for live typing to keep up. Do NOT switch this back to
# cpu to save power.
device = cuda
compute_type = int8_float16
cpu_threads = 16

# Type words as they are recognised rather than waiting for the whole utterance.
# Without this nothing appears until you press F9 again, which on a slower-than-
# realtime CPU backend feels like it has not worked.
live = true
# How often the streaming transcriber emits confirmed words. Lower feels more
# responsive but re-runs the decoder more often; 1.4s is the project default.
live_interval = 1.4

# After you stop, re-transcribe the whole recording and correct what the live
# pass typed. Live runs on partial audio, so it commits words before the model
# has heard the end of the sentence and can never use later context to fix an
# earlier guess. The second pass can.
#
# It only deletes text when it is certain the cursor has not moved — see
# _second_pass in dictate.py. Set false if you would rather nothing was ever
# taken back.
# OFF. Tests found three ways it deletes text that is not its own:
#   - the idle check runs BEFORE transcription, not immediately before the
#     backspaces, and on CPU those are seconds apart. Type or alt-tab during
#     "second pass" and the backspaces land wherever focus now is.
#   - text you type yourself after the live output is still eaten: the code only
#     checks that input was >1.2s ago, not that none happened at all.
#   - characters that FAILED to type are counted as typed, so a failed write
#     makes it erase your preceding text instead.
# Live transcription is unaffected. Re-enable once those are fixed.
second_pass = false
