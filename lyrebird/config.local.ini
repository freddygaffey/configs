# Lyrebird (offline dictation) — this machine's settings.
#
# Lyrebird is treated as a dependency: the program lives in its own checkout,
# the CONFIGURATION lives here and is symlinked in by i3/scripts/dictate. That
# way the settings are version-controlled and survive the checkout being moved,
# reinstalled or deleted — which has already happened once.
#
# Loaded as an overlay ON TOP of the checkout's config/config.ini (see
# load_config in src/dictate.py), and gitignored there, so the committed
# defaults stay correct for the Mac while these apply only here.

[hotkey]
# Only used by the pynput listener, which is not the front end on Linux — i3
# binds F9 and runs `dictate --toggle`. Kept in step so the two agree.
key = f9
mode = toggle

[transcription]
# NOT mlx: that is the Apple Metal backend and it raises
# "MLX backend requested but unavailable: not Apple Silicon" here.
# auto resolves to ctranslate2 (faster-whisper).
backend = auto

# Not auto. Once the nvidia driver was repaired, auto selected CUDA, but
# ctranslate2 needs libcublas/libcudnn which are not installed — it logged
# "Library libcublas.so.12 is not found" and skipped warm-up. CPU with int8 on
# 16 threads runs at roughly 0.7x realtime, which is usable for dictation.
# Set device = auto and install nvidia-cudnn-cu12 in the venv for the GPU.
device = cpu
compute_type = int8
cpu_threads = 16

# Type words as they are recognised rather than waiting for the whole utterance.
# Without this nothing appears until you press F9 again, which on a slower-than-
# realtime CPU backend feels like it has not worked.
live = true
# How often the streaming transcriber emits confirmed words. Lower feels more
# responsive but re-runs the decoder more often; 1.4s is the project default.
live_interval = 1.4

# After you stop, re-transcribe the whole recording and correct what the live
# pass typed. Live runs on partial audio, so it commits words before the model
# has heard the end of the sentence and can never use later context to fix an
# earlier guess. The second pass can.
#
# It only deletes text when it is certain the cursor has not moved — see
# _second_pass in dictate.py. Set false if you would rather nothing was ever
# taken back.
second_pass = true
