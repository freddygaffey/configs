# i3status — the i3 bar's content. Symlinked to ~/.config/i3/i3status.conf.
#
# Two machine-specific gotchas worth knowing before editing:
#   • This laptop's battery is BAT1, not BAT0. i3status's `battery 0` would
#     silently render nothing. Hence `battery 1`.
#   • CPU temp comes from the thermal_zone path, not coretemp/hwmon. coretemp
#     is more accurate, but its hwmon index is not stable across boots (it was
#     hwmon7 when this was written) and i3status does not glob paths. acpitz via
#     thermal_zone0 is stable and good enough for "is it cooking".

general {
        colors = true
        interval = 5
        color_good     = "#78a9ff"
        color_degraded = "#f1c21b"
        color_bad      = "#ee5396"
        separator = false
}

# Order is left-to-right in the bar.
order += "read_file profile"
order += "cpu_usage"
order += "cpu_temperature 0"
order += "load"
order += "memory"
order += "disk /"
order += "wireless _first_"
order += "ethernet _first_"
order += "battery 1"
order += "tztime local"

# The ACPI platform profile — the thing Fn+Q cycles, and what the udev rule
# flips on AC/battery. Surfacing it in the bar makes power state visible instead
# of something you have to go and read from /sys.
read_file profile {
        path = "/sys/firmware/acpi/platform_profile"
        format = "⚡ %content"
        format_bad = "⚡ ?"
}

cpu_usage {
        format = "cpu %usage"
        max_threshold = 75
}

cpu_temperature 0 {
        format = "%degrees°C"
        max_threshold = 85
}

load {
        format = "load %1min"
        # 24 threads, so a load of 8 is unremarkable here. Default threshold of
        # 5 would sit permanently orange.
        max_threshold = 20
}

memory {
        format = "mem %used/%total"
        threshold_degraded = "8G"
        threshold_critical = "2G"
        format_degraded = "mem LOW %available"
}

disk "/" {
        format = "/ %avail"
        low_threshold = 10
        threshold_type = percentage_avail
}

wireless _first_ {
        format_up = "wifi %quality %essid"
        format_down = "wifi -"
}

ethernet _first_ {
        format_up = "eth %ip"
        format_down = ""
}

# %consumption is the live draw in watts — the number this machine actually
# needs watched, given 24 threads on a 74.5 Wh pack.
battery 1 {
        format = "%status %percentage %remaining %consumption"
        format_down = "no battery"
        status_chr = "chr"
        status_bat = "bat"
        status_unk = "unk"
        status_full = "full"
        # Percentage against last-full rather than design capacity, so it
        # reflects the pack's real state (93% health at 246 cycles).
        last_full_capacity = true
        integer_battery_capacity = true
        low_threshold = 20
        threshold_type = percentage
}

tztime local {
        format = "%a %d %b %H:%M"
}
