# i3status — the i3 bar's content. Symlinked to ~/.config/i3/i3status.conf.
#
# Read alongside i3/scripts/status, which wraps this and post-processes the JSON:
# it inserts the GPU block, colour-codes load, shortens the profile name, and
# drops the battery wattage when nothing is flowing. Anything that needs logic
# lives there, because i3status modules can only do fixed thresholds.
#
# Machine-specific gotchas, each of which has bitten once:
#   - The battery is BAT1, not BAT0. i3status's default `battery 0` silently
#     renders nothing at all.
#   - CPU temp comes from thermal_zone, not coretemp: coretemp's hwmon index is
#     not stable across boots and i3status cannot glob paths.
#   - output_format must be explicit. i3status auto-detects it and falls back to
#     plain text when it is not talking straight to i3bar, which is the case here
#     because of the wrapper. Without it the bar shows literal 'cpu 01%false27C'.
#
# Volume, wifi and bluetooth all live in the bar, next to each other. They are
# system indicators and belong together — but i3bar orders tray icons by
# registration order with no way to change it, so in the tray they kept getting
# interleaved with application icons. The tray now holds applications only.
#
# i3status's wireless module reads the kernel directly and is instant. Do not be
# tempted by nmcli for this: `nmcli dev wifi` forces a scan and takes ~3.7s,
# which is hopeless on a bar that refreshes every 5s.

general {
        output_format = "i3bar"
        colors = true
        interval = 5
        color_good     = "#25be6a"
        color_degraded = "#f1c21b"
        color_bad      = "#ee5396"
        separator = true
}

# Left to right. The GPU block is injected by the wrapper immediately after the
# profile, so the two power readings sit together.
order += "tztime local"
order += "read_file profile"
order += "cpu_usage"
order += "cpu_temperature 0"
order += "load"
order += "memory"
order += "disk /"
order += "volume master"
order += "ethernet _first_"
order += "battery 1"

# The ACPI platform profile — what Super+p cycles and what the AC/battery udev
# rule flips. The wrapper shortens the value, since "power-saver" is wide.
read_file profile {
        path = "/sys/firmware/acpi/platform_profile"
        format = "%content"
        format_bad = "?"
}

cpu_usage {
        format = "cpu %usage"
        max_threshold = 75
}

cpu_temperature 0 {
        format = "%degrees°C"
        max_threshold = 85
}

# Colour-coded by the wrapper rather than here: i3status only offers a single
# max_threshold, which cannot express "fine / busy / saturated" on 24 threads.
load {
        format = "load %1min"
}

memory {
        format = "%used/%total"
        unit = "G"
        decimals = 0
        threshold_degraded = "8G"
        threshold_critical = "2G"
        format_degraded = "mem LOW %available"
}

disk "/" {
        format = "%avail"
        low_threshold = 10
        threshold_type = percentage_avail
}

volume master {
        format = "vol %volume"
        format_muted = "vol ---"
        device = "default"
        mixer = "Master"
        mixer_idx = 0
}

# Hidden entirely when down — this machine is normally on WiFi.
# Just the word "wifi", which the wrapper swaps for a glyph. No percentage:
# this is an icon beside the bluetooth one, and i3status already colours it by
# signal quality, so the number was saying twice what the colour says once.
wireless _first_ {
        format_up = "wifi"
        format_down = "wifi"
}

ethernet _first_ {
        format_up = "eth %ip"
        format_down = ""
}

# %consumption is real draw while discharging, and charge rate while charging.
# It reads 0.00 W when plugged in and full.
battery 1 {
        format = "%status %percentage %remaining %consumption"
        format_down = "no bat"
        status_chr = "chr"
        status_bat = "bat"
        status_unk = "unk"
        status_full = "full"
        last_full_capacity = true
        integer_battery_capacity = true
        low_threshold = 20
        threshold_type = percentage
}

tztime local {
        format = "%a %d %b %H:%M"
}
