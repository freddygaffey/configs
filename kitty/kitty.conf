# kitty — shared by the Mac and the Linux box. Symlinked to
# ~/.config/kitty/kitty.conf.
#
# Chosen over Ghostty for one concrete reason: `kitty @ set-colors` repaints a
# running terminal instantly, which is what makes the light/dark/fly switch
# usable. Ghostty cannot reload its config programmatically at all — its own man
# page says so — and faking it by sending a keystroke is a hack around a missing
# feature. kitty also speaks the kitty graphics protocol natively, which the tmux
# `prefix + i` image popup depends on, and runs on macOS so both machines match.

# ── Font ───────────────────────────────────────────────────────────────
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
# Ligatures are distracting in code but fine elsewhere; off only while the
# cursor is on them.
disable_ligatures cursor

# ── Theme ──────────────────────────────────────────────────────────────
# Colours live in a separate file that i3/scripts/ui-mode swaps, so the mode
# switch is one file copy plus a live `kitty @ set-colors`.
include theme.conf

# ── Window ─────────────────────────────────────────────────────────────
# No title bar and no tab bar: i3 does window management and tabbing, and two
# layers of chrome for the same job wastes rows.
hide_window_decorations yes
tab_bar_style           hidden
window_padding_width    6
confirm_os_window_close 0

# ── Remote control ─────────────────────────────────────────────────────
# Required for `kitty @ set-colors`. The socket is abstract (@-prefixed), so it
# lives in the abstract namespace rather than on disk.
allow_remote_control yes
listen_on unix:@mykitty

# ── Behaviour ──────────────────────────────────────────────────────────
scrollback_lines 10000
# tmux owns copy-mode; don't fight it by hijacking selection.
copy_on_select   no
strip_trailing_spaces smart
enable_audio_bell no
# Let a URL be clicked without stealing ordinary clicks from the TUI underneath.
mouse_map ctrl+left press ungrabbed,grabbed mouse_click_url

# ── Keybindings ────────────────────────────────────────────────────────
# Deliberately sparse. tmux owns splits, tabs and navigation, and those are the
# ones that survive an ssh hop — duplicating them here means two layers
# competing for the same chords.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+plus  change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0
