# tmux — vim-friendly, carbonfox-themed, macOS + Linux.
# Symlinked to ~/.config/tmux/tmux.conf by bootstrap.sh.

# ── General ────────────────────────────────────────────────────────────
set -g  default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:RGB,xterm-256color:RGB,alacritty:RGB"
set -g  mouse on
set -g  history-limit 50000
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on
set -sg escape-time 0            # no <Esc> delay — important for nvim
set -g  focus-events on
set -g  set-clipboard on         # let apps (nvim) set the clipboard via OSC 52
set -g  allow-passthrough on     # pass OSC 52 through to the terminal

# ── Prefix: C-a ────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind -N "reload tmux.conf" r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── Splits (vim-style, keep current dir) ───────────────────────────────
unbind '"'
unbind %
bind -N "split right (current dir)" | split-window -h -c "#{pane_current_path}"
bind -N "split down (current dir)"  - split-window -v -c "#{pane_current_path}"
# Windows:
#   c     new window in the session default dir (tmux default behaviour)
#   M-c   set the session default dir to the current pane's dir (anchor here)
#   C     set the session default dir by fuzzy-picking a path (fzf popup with
#         tab-as-you-type autocomplete over real directories under ~)
bind -N "new window (session default dir)"            c   new-window
bind -N "set session default dir to current pane dir" M-c attach-session -c "#{pane_current_path}"
# Pick a new session root from an fzf popup (autocompletes as you type). fzf is
# installed by both bootstrap scripts, so this works on full and lite boxes.
# The popup can't run `attach-session -c` itself (no client → "not a terminal"),
# so it just stashes the chosen dir in @newroot and tmux applies it afterwards.
# Single-quote the popup command so tmux passes $HOME/$d through to the shell
# verbatim instead of trying to expand them as tmux environment variables.
bind -N "set session default dir (fzf-pick a path)" C {
    set -g @newroot ""
    display-popup -E -w 70% -h 70% -d "#{pane_current_path}" 'd=$({ pwd; find -L "$HOME" -maxdepth 4 \( -name node_modules -o -name ".*" \) -prune -o -type d -print 2>/dev/null; } | fzf --reverse --prompt "session root> ") && [ -n "$d" ] && tmux set -g @newroot "$d"'
    if-shell -F "#{@newroot}" "attach-session -c \"#{@newroot}\" ; display \"session root set to #{@newroot}\""
}

# prefix + N → create a NEW session: fuzzy-pick its working dir (fzf popup,
# autocompletes as you type over real dirs under ~), then type a name (Enter
# on an empty name defaults to the dir's basename). Same trick as `C` above:
# the popup has no client of its own, so it creates the session detached and
# stashes the chosen name in @newsess; tmux switches this client to it after
# the popup closes. The has-session guard means typing an existing name just
# jumps to that session instead of erroring.
# Ctrl-C cancels at any stage: `trap "exit 130" INT` bails the popup shell out
# immediately, and the `if read` guard means an interrupted/EOF name prompt
# creates nothing (without it, a Ctrl-C'd read fell through and made a session
# named after the dir anyway). Nothing gets stashed in @newsess, so the client
# stays put.
bind -N "new session (fzf-pick dir + name)" N {
    set -g @newsess ""
    display-popup -E -w 70% -h 70% -d "#{pane_current_path}" 'trap "exit 130" INT; d=$({ pwd; find -L "$HOME" -maxdepth 4 \( -name node_modules -o -name ".*" \) -prune -o -type d -print 2>/dev/null; } | fzf --reverse --prompt "session dir> ") && [ -n "$d" ] && { printf "session name (Ctrl-C to cancel) [%s]: " "$(basename "$d")"; if read -r n; then [ -z "$n" ] && n=$(basename "$d"); tmux has-session -t "=$n" 2>/dev/null || tmux new-session -d -s "$n" -c "$d"; tmux set -g @newsess "$n"; fi; }'
    if-shell -F "#{@newsess}" "switch-client -t \"#{@newsess}\" ; display \"switched to session #{@newsess}\""
}

# Merge another window into this one as a pane (prompts for the window number).
#   m → side-by-side (horizontal split)   M → stacked (vertical split)
# Merge another window into this one as a pane. Standard, widely-used idiom:
# prompt for the window number, then join-pane -s it. Type the index of a window
# in THIS session.
#   m → side-by-side (horizontal split)   M → stacked (vertical split)
# NB: don't leave a "marked pane" set (the > menu / select-pane -m). If the index
# you type doesn't exist in the current session, join-pane falls back to the
# marked pane — which is how a window from another session ("skydock") got
# yanked. With no mark set, a bad index just errors instead.
bind -N "merge a window in beside this pane (left/right)" m command-prompt -p "merge window (h):" "join-pane -h -s '%%'"
bind -N "merge a window in below this pane (top/bottom)"  M command-prompt -p "merge window (v):" "join-pane -v -s '%%'"

# Switch this client to another session.
#   g → prompt for a session name   s → pick from the session tree (built-in)
#   ( / ) → previous / next session (built-in)
bind -N "go to a session by name" g command-prompt -p "switch to session:" "switch-client -t '%%'"

# prefix + k → kill the current session (asks first, since it's destructive),
# then drop the client into the last-used session instead of detaching.
# Trick: switch-client -l first (client jumps to the previous session), which
# makes the just-left session the new "last" — so kill-session -t
# #{client_last_session} then kills the one we came from. If there is no last
# session (fresh client, never switched), fall back to a plain kill-session,
# which lets tmux pick a remaining session or detach if this was the only one.
bind -N "kill this session, jump to the last-used one" k \
    confirm-before -p "kill session #S? (y/n)" {
        if-shell -F "#{client_last_session}" {
            switch-client -l
            kill-session -t "#{client_last_session}"
        } {
            kill-session
        }
    }

# prefix + Tab → jump back to the last (previously active) window, toggling
# between the two most-recent windows.
bind -N "switch to the last active window" Tab last-window

# ── View an image inline ───────────────────────────────────────────────
# prefix + i → prompt for an image path, render it in a centred popup with
# chafa (installed by bootstrap.sh). In Ghostty this is full-resolution via the
# Kitty graphics protocol; on terminals without it chafa falls back to
# high-detail Unicode blocks, so it works everywhere (incl. over SSH). Any key
# closes the popup. Tab-completes the path at the prompt.
bind -N "view an image in a popup (chafa)" i command-prompt -p "image:" \
    "display-popup -E -w 90% -h 90% 'chafa \"%%\"; printf \"\\n[Enter to close]\"; read _'"

# ── Pane nav — seamless with nvim (vim-tmux-navigator) ─────────────────
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Resize: prefix + H/J/K/L
bind -r -N "resize pane left"  H resize-pane -L 5
bind -r -N "resize pane down"  J resize-pane -D 5
bind -r -N "resize pane up"    K resize-pane -U 5
bind -r -N "resize pane right" L resize-pane -R 5
bind -r -N "next window"     C-n next-window
bind -r -N "previous window" C-p previous-window

# ── Mouse wheel scrolling ──────────────────────────────────────────────
# Default tmux wheel behaviour is janky: it half-enters copy-mode and jumps.
# Fix it so the wheel feels native:
#   • if the focused program reads mouse itself (nvim, less, man, htop) the
#     wheel is passed straight through so *it* scrolls;
#   • otherwise the wheel enters copy-mode with -e (which auto-exits the moment
#     you scroll back to the bottom) and moves 3 lines per notch.
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" \
    "send-keys -M" \
    "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down

# ── Copy mode — vi keys + system clipboard ─────────────────────────────
# Enter:   Ctrl-a v   (or Ctrl-a [)
# Select:  v   yank: y   rectangle: Ctrl-v   cancel: Esc
# Paste:   Ctrl-a ]
# Mouse:   drag to select — it auto-copies on release.
setw -g mode-keys vi
bind -N "enter copy mode"      v copy-mode
bind -N "paste from buffer"    ] paste-buffer -p
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Over SSH: rely on OSC 52 (set-clipboard on) so it reaches the *local* Mac.
# Locally: also pipe into the OS clipboard tool for robustness.
if-shell '[ -n "$SSH_CONNECTION" ]' {
    bind-key -T copy-mode-vi y                  send-keys -X copy-selection-and-cancel
    bind-key -T copy-mode-vi Enter              send-keys -X copy-selection-and-cancel
    bind-key -T copy-mode-vi MouseDragEnd1Pane  send-keys -X copy-selection-and-cancel
} {
    if-shell "uname | grep -q Darwin" {
        bind-key -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel "pbcopy"
        bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
    } {
        if-shell '[ -n "$WAYLAND_DISPLAY" ]' {
            bind-key -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel "wl-copy"
            bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
        } {
            bind-key -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel "xclip -se c -i"
            bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -se c -i"
        }
    }
}

# ── Carbonfox look ─────────────────────────────────────────────────────
# This is the static baseline. When nvim is running inside tmux it pushes the
# live colorscheme into these same options (see sync_tmux_theme in init.lua),
# so the bar/borders track whatever theme nvim is using.
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#161616,fg=#f2f4f8"
set -g status-left-length 30
set -g status-left "#[bg=#78a9ff,fg=#161616,bold] #S #[bg=#161616]"
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[fg=#ee5396]PREFIX ,}#[fg=#33b1ff]%a %d %b #[fg=#78a9ff]%H:%M "
setw -g window-status-format         "#[fg=#6b6b6b] #I #W "
setw -g window-status-current-format "#[bg=#2a2a2a,fg=#78a9ff,bold] #I #W "
setw -g window-status-separator ""
set -g pane-border-style        "fg=#2a2a2a"
set -g pane-active-border-style "fg=#78a9ff"
set -g message-style            "bg=#2a2a2a,fg=#f2f4f8"
set -g mode-style               "bg=#78a9ff,fg=#161616"

# NB: deliberately no window-style / window-active-style. Dimming inactive panes
# via a bg/fg override flattens full-screen TUIs (nvim, Claude) to a grey wash,
# since it clobbers the colours the app paints itself. The active-border accent
# above is enough to show which pane has focus.

# ── Plugins (TPM) ──────────────────────────────────────────────────────
# Managed by the Tmux Plugin Manager. bootstrap.sh / bootstrap-lite.sh clone TPM
# and install these headlessly, so a fresh `curl | bash` box comes up with them
# already working — no manual `prefix + I` needed. All pure shell, nothing
# compiles, so they're safe on the 512 MB lite boxes too.
#   prefix + I  install new plugins      prefix + U  update them
#   prefix + Ctrl-s  save the session    prefix + Ctrl-r  restore it
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # manual save/restore of sessions
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save + restore-on-start

# resurrect: also save & restore each pane's scrollback and the program it ran.
set -g @resurrect-capture-pane-contents 'on'
# resurrect: relaunch Claude Code CLI panes on restore. tmux-resurrect only
# re-runs programs it's explicitly told to; `claude` isn't a default, so without
# this a restored Claude pane comes back as a bare shell (old text frozen on
# screen, no live session) — the "erased session" problem. `~claude` relaxes
# name-matching onto the native `claude` binary; `->claude --continue` restores
# it by resuming the most recent conversation in that pane's directory. Claude
# persists every conversation to disk, so the full thread (history + context)
# comes back and you keep going. NB: a live process can't survive a reboot — this
# re-launches Claude and lets it reload the thread, which is as close as possible.
# Gotcha: two Claude panes in the SAME directory would both resume that dir's
# single latest conversation; if you run windows that share a dir, switch to
#   set -g @resurrect-processes '"~claude->claude --resume"'
# which drops each restored pane on Claude's pick-a-conversation list instead.
set -g @resurrect-processes '"~claude->claude --continue"'
# continuum: auto-save every 15 min and silently restore the last saved session
# whenever the tmux server first starts.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# prefix + R  ->  restore the last saved session (in addition to resurrect's own
# prefix + Ctrl-r). Runs the restore script via run-shell so it executes inside
# the tmux server ($TMUX set); running it from a bare shell fails to find the
# socket. Reboot workflow: open a terminal, run `tmux`, then press prefix + R.
# Lowercase r stays as "reload tmux.conf".
bind -N "restore last saved tmux session (resurrect)" R \
  run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh'

# Where TPM looks for installed plugins. This line is NOT optional: when
# TMUX_PLUGIN_MANAGER_PATH is unset, tpm defaults it to ~/.config/tmux/plugins/
# *if an XDG-style config exists* — and ours is exactly that (bootstrap symlinks
# this file to ~/.config/tmux/tmux.conf), while the bootstrap installs plugins
# into ~/.tmux/plugins/. Mismatched, tpm sources plugins from an empty directory
# and says nothing (source_plugins.sh runs with >/dev/null 2>&1). The failure is
# invisible and nasty: resurrect never sets @resurrect-save-script-path, so
# continuum's save hook — which IS in status-right — silently does nothing on
# every refresh, and auto-save looks armed while never writing a file.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"

# Keep this as the LAST line of the file: it boots TPM, which then loads every
# plugin declared above.
run '~/.tmux/plugins/tpm/tpm'
