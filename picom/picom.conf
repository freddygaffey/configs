# picom — just enough compositing to show which window has focus.
#
# Deliberately minimal. The only reason this runs at all is that i3 cannot do
# transparency itself: window opacity lives in _NET_WM_WINDOW_OPACITY and nothing
# acts on it without a compositor. Everything a compositor is usually wanted for
# — blur, shadows, fancy animations — costs power on a laptop whose battery life
# has been the point of most of this configuration, so it is all off.
#
# Started by i3 (exec_always in i3/config). Symlinked to ~/.config/picom.conf.

# ── Focus ──────────────────────────────────────────────────────────────
# DIM, not opacity. inactive-opacity makes the window translucent, so whatever
# is behind it shows through — which in a tiling WM is usually the wallpaper, but
# over a browser or a stacked/tabbed container it reads as ghosting: you can see
# the thing underneath. inactive-dim blends toward black instead, so the window
# stays opaque and simply recedes.
#
# 0.15 rather than something dramatic: enough to see at a glance which window is
# live, not enough to make unfocused text hard to read — you still want to follow
# a build log in the pane you are not typing in.
# Mostly transparency now that there are wallpapers behind the windows, with
# only a touch of dim on top. The earlier all-dim setting was a response to
# ghosting over a browser; with an image behind it, see-through is the point.
# 0.92/0.03 rather than 0.88/0.05. These compound with the terminal's OWN
# background opacity, so an unfocused terminal was losing contrast twice — once
# to kitty letting the wallpaper through, again to picom. Enough to see which
# window is live, not enough to make the other one hard to read.
inactive-opacity = 0.92;
inactive-dim = 0.03;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Never dim these. A dimmed video or screenshot selection is just wrong, and a
# dimmed bar flickers as focus moves.
focus-exclude = [
  "class_g = 'i3bar'",
  # rofi is an override-redirect window, so picom never sees it as focused and
  # would apply inactive-opacity on top of the alpha rofi already sets — two
  # transparencies multiplying, which is why it looked more see-through than its
  # own theme asked for.
  "class_g = 'Rofi'",
  "class_g = 'rofi'",
  "class_g = 'flameshot'",
  "class_g = 'Flameshot'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'",
  "class_g = 'firefox' && argb"
];

# NB i3bar is deliberately absent here. It sets its own alpha through an 8-digit
# RGBA background colour, and an opacity-rule pinning it to 100 overrides that —
# which is why the bar stayed a solid band across the wallpaper.
opacity-rule = [
  "100:class_g = 'Rofi'",
  "100:class_g = 'rofi'",
  "100:class_g = 'flameshot'",
  "100:fullscreen"
];

# Never dim these either — a dimmed bar or screenshot selection is just wrong.
dim-exclude = [
  "class_g = 'i3bar'",
  "class_g = 'Rofi'",
  "class_g = 'rofi'",
  "class_g = 'flameshot'",
  "class_g = 'Flameshot'"
];

# ── Everything expensive: off ──────────────────────────────────────────
# Each of these is a per-frame cost for decoration this setup does not want.
fading = false;
shadow = false;
blur-background = false;
animations = false;

# ── Backend ────────────────────────────────────────────────────────────
# glx uses the Intel iGPU, which is both faster and cheaper than xrender doing
# the same work on the CPU. It does NOT wake the discrete GPU — that stays
# asleep, which is what the ~12 W of power work depends on.
backend = "glx";
vsync = true;
# Only repaint what changed. Without this picom redraws the whole screen every
# frame, which is the difference between "barely measurable" and "noticeable".
use-damage = true;

# Was true: don't composite when a window is fullscreen, so video and games
# bypass the compositor. Turned OFF because it made the terminal flicker on every
# keystroke.
#
# Why it started: a TRANSPARENT window can never be unredirected, so while the
# terminal had background_opacity < 1 this setting never applied to it. Making
# the terminal opaque made it eligible, and picom then redirected and
# unredirected it as the window repainted — once per keystroke.
#
# The cost of off is a frame of latency in fullscreen video. That is a fair trade
# against a terminal that flickers while you type.
unredir-if-possible = false;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
